notes: No public pricing — Paychex Developer Program offers a "Client" and "Partner" access
  model. API access is bundled into a Paychex client subscription or a partner integration
  agreement; no standalone API rate card is published. The developer portal does not list
  prices or per-call rates.
tags:
  - Payroll
  - HR
  - Benefits
  - Time and Attendance
description: Paychex APIs are accessed via the Paychex Developer Program under either a Client
  or Partner pathway. Pricing is bundled with Paychex's payroll / HR product subscription
  for clients, or governed by a partner integration agreement. No public per-API price list.
sources:
  - https://developer.paychex.com/
plans:
  - id: paychex-client-api
    name: Client API Access
    type: enterprise
    description: API access bundled into the customer's existing Paychex payroll / HR subscription
      so they can integrate their own systems with their Paychex data.
    entries:
      - label: Bundled with Paychex Subscription
        name: bundled_subscription
        type: subscription
        metric: contract
        limit: -1
        timeFrame: month
        geo: US
        unit: 1
        price: included with Paychex client subscription
        userMultiplied: false
    elements:
      - name: Workers, Companies, Payroll, Time & Attendance APIs
      - name: OAuth2 Authentication
  - id: paychex-partner-api
    name: Partner API Access
    type: enterprise
    description: ISV / partner integration access governed by a Paychex partnership agreement.
      Pricing is partnership-specific.
    entries:
      - label: Partnership Agreement
        name: partnership_agreement
        type: subscription
        metric: contract
        limit: -1
        timeFrame: year
        geo: US
        unit: 1
        price: contact partnerships
        userMultiplied: false
    elements:
      - name: Partner Sandbox
      - name: Production API Credentials
      - name: Marketplace Listing (where applicable)
