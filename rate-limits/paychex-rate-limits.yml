specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Paychex
providerId: paychex
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
notes: No public rate-limit numbers. The Paychex Developer Program landing page does not
  publish per-second / per-minute thresholds; specific limits are likely disclosed in authenticated
  developer documentation or in the partner agreement.
tags:
  - Rate Limiting
  - Payroll
  - HR
description: Paychex does not publish API rate-limit numbers on its public developer portal.
  Limits are likely tenant-specific and disclosed under the Client or Partner integration
  agreement.
sources:
  - https://developer.paychex.com/
responseCodes:
  throttled: 429
limits:
  - name: Client / Partner API
    scope: tenant
    metric: varies
    limit: see authenticated developer documentation
    notes: Limits not disclosed publicly.
policies:
  - name: Backoff
    description: Standard exponential backoff with jitter is recommended on 429 responses.
  - name: OAuth Scoping
    description: Client and Partner credentials are scoped to specific Paychex products and
      data domains; throttling decisions may differ per scope.
maintainers:
