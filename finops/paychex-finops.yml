specification: FinOps Framework
specificationVersion: '1.0'
schema: https://www.finops.org/framework/
provider: Paychex
providerId: paychex
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
notes: No public per-API price. Paychex bills clients for the underlying payroll / HR / benefits
  product; API access is bundled. Structural FinOps placeholder reflecting the SaaS payroll
  shape.
tags:
  - FinOps
  - FOCUS
  - Payroll
  - HR
  - Benefits
description: FinOps definition for Paychex. APIs are bundled with the underlying payroll
  / HR / benefits product subscription; no standalone API rate card. Meters reflect typical
  payroll-SaaS billing (employees, payrolls run, benefits administration).
sources:
  - https://developer.paychex.com/
  - https://focus.finops.org/focus-specification/v1-3/
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
publisherName: Paychex, Inc.
serviceCategory: Payroll / HR
billingModel:
  pricingCategory: Subscription + Per-Employee Per-Payroll
  billingFrequency: Per Pay Cycle / Monthly
  billingCurrency: USD
  chargeCategories:
    - Purchase
    - Usage
    - Tax
focusColumns:
  ServiceName: Paychex
  ServiceCategory: Payroll / HR
  ProviderName: Paychex
  PublisherName: Paychex, Inc.
  InvoiceIssuerName: Paychex, Inc.
  BillingCurrency: USD
  ChargeCategory: Purchase
meters:
  - name: employees_paid
    description: Active employees included in a payroll run
    unit: employee
    aggregation: sum
    dimensions:
      - company
      - pay_cycle
  - name: payrolls_run
    description: Number of payroll runs in the billing period
    unit: payroll
    aggregation: count
    dimensions:
      - company
      - frequency
  - name: benefits_seats
    description: Employees enrolled in administered benefits
    unit: seat-month
    aggregation: max
    dimensions:
      - company
      - plan
  - name: api_requests
    description: API requests against Paychex Developer APIs (bundled, not separately metered
      in public pricing)
    unit: request
    aggregation: count
    dimensions:
      - client_id
      - product
principles:
  - name: Visibility
    description: Visibility comes from the Paychex client portal and the monthly invoice;
      API requests are not separately billed line items in public pricing.
  - name: Allocation
    description: Allocate by Paychex client number and by integrated app (client_id) when
      using the developer APIs.
  - name: Optimization
    description: Optimize by reducing manual payroll adjustments (which can carry per-action
      fees), automating onboarding/offboarding through the API, and rationalizing benefits
      plans.
  - name: Accountability
    description: Payroll / HR director accountable for the Paychex contract; integration
      owner accountable for API consumer behavior.
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
